{% extends "base.html" %}
{% block title %}New measurement · Gymweb{% endblock %}

{% block content %}
<h1>New body measurement</h1>
<form method="post" class="form">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <label>
      <span>{{ field.label }}</span>
      {{ field }}
      {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
      {{ field.errors }}
    </label>
  {% endfor %}
  <div class="actions">
    <button class="btn" type="submit">Save</button>
    <a class="btn ghost" href="{% url 'tracker:log' %}">Cancel</a>
  </div>
</form>
{% endblock %}
