{% load bilingual %}
{# MuscleWiki-style dual silhouette (front / back). Regions map to exercise_library category slugs. #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" class="mw-body-svg" aria-hidden="false" role="img">
  <title>{% t "Interactive muscle map — click a region" "肌群地圖 — 點選區塊" %}</title>
  <defs>
    <pattern id="mwGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(138,160,191,0.22)" stroke-width="0.45"/>
    </pattern>
    <filter id="mwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Panel background -->
  <rect width="580" height="520" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(138,160,191,0.35)"/>

  <!-- Grid -->
  <rect x="8" y="8" width="564" height="504" rx="12" fill="url(#mwGrid)"/>

  <!-- Labels -->
  <text x="145" y="34" text-anchor="middle" fill="#8aa0bf" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">{% t "Front" "正面" %}</text>
  <text x="435" y="34" text-anchor="middle" fill="#8aa0bf" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">{% t "Back" "背面" %}</text>

  <!-- ========== FRONT (translate to center ~145) ========== -->
  <g transform="translate(15,42)">
    <!-- Base silhouette -->
    <path fill="rgba(148,163,184,0.28)" stroke="#64748b" stroke-width="1.4"
      d="M130 22
         C156 22 168 42 168 62 L168 82
         C188 94 198 118 193 148 L187 228
         C184 268 176 298 166 318 L156 392
         C151 418 146 438 130 452
         C114 438 109 418 104 392 L94 318
         C84 298 76 268 73 228 L67 148
         C62 118 72 94 92 82 L92 62
         C92 42 104 22 130 22 Z"/>
    <!-- Head -->
    <ellipse cx="130" cy="46" rx="21" ry="25" fill="rgba(148,163,184,0.55)" stroke="#64748b" stroke-width="1.2"/>

    <!-- Chest -->
    <path class="mw-region" data-slug="chest" fill="rgba(251,191,36,0.62)" stroke="rgba(180,130,40,0.95)" stroke-width="1.1" filter="url(#mwGlow)"
      d="M88 78 Q130 62 172 78 L169 122 Q130 138 91 122 Z">
      <title>{% t "Chest" "胸部" %}</title>
    </path>

    <!-- Shoulders -->
    <path class="mw-region" data-slug="shoulders" fill="rgba(251,146,60,0.58)" stroke="rgba(200,100,45,0.95)" stroke-width="1.1"
      d="M74 74 L94 74 L94 98 L68 108 Q62 90 74 74 Z">
      <title>{% t "Shoulders" "肩部" %}</title>
    </path>
    <path class="mw-region" data-slug="shoulders" fill="rgba(251,146,60,0.58)" stroke="rgba(200,100,45,0.95)" stroke-width="1.1"
      d="M186 74 L166 74 L166 98 L192 108 Q198 90 186 74 Z">
      <title>{% t "Shoulders" "肩部" %}</title>
    </path>

    <!-- Arms (upper + forearm grouped as arms category) -->
    <path class="mw-region" data-slug="arms" fill="rgba(239,68,68,0.55)" stroke="rgba(170,45,45,0.95)" stroke-width="1.1"
      d="M66 112 L90 100 L96 182 L70 192 Q62 150 66 112 Z">
      <title>{% t "Arms" "手臂" %}</title>
    </path>
    <path class="mw-region" data-slug="arms" fill="rgba(239,68,68,0.55)" stroke="rgba(170,45,45,0.95)" stroke-width="1.1"
      d="M194 112 L170 100 L164 182 L190 192 Q198 150 194 112 Z">
      <title>{% t "Arms" "手臂" %}</title>
    </path>
    <path class="mw-region" data-slug="arms" fill="rgba(253,186,116,0.48)" stroke="rgba(190,110,55,0.9)" stroke-width="1"
      d="M72 195 L96 185 L100 258 L76 266 Z">
      <title>{% t "Arms (forearms)" "手臂（前臂）" %}</title>
    </path>
    <path class="mw-region" data-slug="arms" fill="rgba(253,186,116,0.48)" stroke="rgba(190,110,55,0.9)" stroke-width="1"
      d="M188 195 L164 185 L160 258 L184 266 Z">
      <title>{% t "Arms (forearms)" "手臂（前臂）" %}</title>
    </path>

    <!-- Core -->
    <path class="mw-region" data-slug="core" fill="rgba(253,186,116,0.58)" stroke="rgba(200,120,70,0.92)" stroke-width="1.1"
      d="M94 124 L166 124 L164 188 L96 188 Z">
      <title>{% t "Core & abs" "核心與腹肌" %}</title>
    </path>

    <!-- Hip abductors -->
    <path class="mw-region" data-slug="abductors" fill="rgba(168,85,247,0.48)" stroke="rgba(120,50,190,0.92)" stroke-width="1"
      d="M86 190 L102 190 L98 238 L82 228 Z">
      <title>{% t "Abductors" "髖外展" %}</title>
    </path>
    <path class="mw-region" data-slug="abductors" fill="rgba(168,85,247,0.48)" stroke="rgba(120,50,190,0.92)" stroke-width="1"
      d="M174 190 L158 190 L162 238 L178 228 Z">
      <title>{% t "Abductors" "髖外展" %}</title>
    </path>

    <!-- Legs (quads) -->
    <path class="mw-region" data-slug="legs" fill="rgba(148,163,184,0.58)" stroke="rgba(90,110,135,0.95)" stroke-width="1.1"
      d="M98 190 L106 312 L118 428 L128 448 L112 452 L96 428 L88 312 Z">
      <title>{% t "Legs" "腿部" %}</title>
    </path>
    <path class="mw-region" data-slug="legs" fill="rgba(148,163,184,0.58)" stroke="rgba(90,110,135,0.95)" stroke-width="1.1"
      d="M162 190 L154 312 L142 428 L132 448 L148 452 L164 428 L172 312 Z">
      <title>{% t "Legs" "腿部" %}</title>
    </path>
  </g>

  <!-- ========== BACK ========== -->
  <g transform="translate(275,42)">
    <path fill="rgba(148,163,184,0.28)" stroke="#64748b" stroke-width="1.4"
      d="M130 22
         C156 22 168 42 168 62 L168 82
         C188 94 198 118 193 148 L187 228
         C184 268 176 298 166 318 L156 392
         C151 418 146 438 130 452
         C114 438 109 418 104 392 L94 318
         C84 298 76 268 73 228 L67 148
         C62 118 72 94 92 82 L92 62
         C92 42 104 22 130 22 Z"/>
    <ellipse cx="130" cy="46" rx="21" ry="25" fill="rgba(148,163,184,0.55)" stroke="#64748b" stroke-width="1.2"/>

    <!-- Back / lats -->
    <path class="mw-region" data-slug="back" fill="rgba(34,197,94,0.52)" stroke="rgba(20,120,65,0.95)" stroke-width="1.1"
      d="M76 76 Q130 58 184 76 L180 172 Q130 198 80 172 Z">
      <title>{% t "Back" "背部" %}</title>
    </path>
    <path class="mw-region" data-slug="back" fill="rgba(22,163,74,0.38)" stroke="rgba(20,120,65,0.85)" stroke-width="1"
      d="M94 174 L166 174 L162 212 L98 212 Z">
      <title>{% t "Lower back" "下背" %}</title>
    </path>

    <!-- Rear shoulders -->
    <path class="mw-region" data-slug="shoulders" fill="rgba(251,146,60,0.52)" stroke="rgba(200,100,45,0.95)" stroke-width="1.05"
      d="M68 76 L92 82 L88 112 L64 106 Z">
      <title>{% t "Shoulders (rear)" "肩部（後側）" %}</title>
    </path>
    <path class="mw-region" data-slug="shoulders" fill="rgba(251,146,60,0.52)" stroke="rgba(200,100,45,0.95)" stroke-width="1.05"
      d="M192 76 L168 82 L172 112 L196 106 Z">
      <title>{% t "Shoulders (rear)" "肩部（後側）" %}</title>
    </path>

    <!-- Triceps / arms -->
    <path class="mw-region" data-slug="arms" fill="rgba(239,68,68,0.52)" stroke="rgba(170,45,45,0.95)" stroke-width="1.05"
      d="M62 118 L84 122 L88 182 L64 188 Z">
      <title>{% t "Arms (triceps)" "手臂（三頭）" %}</title>
    </path>
    <path class="mw-region" data-slug="arms" fill="rgba(239,68,68,0.52)" stroke="rgba(170,45,45,0.95)" stroke-width="1.05"
      d="M198 118 L176 122 L172 182 L196 188 Z">
      <title>{% t "Arms (triceps)" "手臂（三頭）" %}</title>
    </path>
    <path class="mw-region" data-slug="arms" fill="rgba(253,186,116,0.45)" stroke="rgba(190,110,55,0.88)" stroke-width="1"
      d="M66 192 L86 188 L90 252 L70 258 Z">
      <title>{% t "Forearms" "前臂" %}</title>
    </path>
    <path class="mw-region" data-slug="arms" fill="rgba(253,186,116,0.45)" stroke="rgba(190,110,55,0.88)" stroke-width="1"
      d="M194 192 L174 188 L170 252 L190 258 Z">
      <title>{% t "Forearms" "前臂" %}</title>
    </path>

    <!-- Glutes / hip — map legs for big muscle mass; abductors lateral -->
    <path class="mw-region" data-slug="abductors" fill="rgba(168,85,247,0.45)" stroke="rgba(120,50,190,0.9)" stroke-width="1"
      d="M78 206 L94 196 L98 236 L82 244 Z">
      <title>{% t "Abductors / glute med" "髖外展／臀中" %}</title>
    </path>
    <path class="mw-region" data-slug="abductors" fill="rgba(168,85,247,0.45)" stroke="rgba(120,50,190,0.9)" stroke-width="1"
      d="M182 206 L166 196 L162 236 L178 244 Z">
      <title>{% t "Abductors / glute med" "髖外展／臀中" %}</title>
    </path>

    <!-- Legs posterior -->
    <path class="mw-region" data-slug="legs" fill="rgba(148,163,184,0.56)" stroke="rgba(90,110,135,0.95)" stroke-width="1.1"
      d="M98 212 L106 318 L118 428 L128 448 L112 452 L96 428 L88 318 Z">
      <title>{% t "Legs (posterior)" "腿部（後側）" %}</title>
    </path>
    <path class="mw-region" data-slug="legs" fill="rgba(148,163,184,0.56)" stroke="rgba(90,110,135,0.95)" stroke-width="1.1"
      d="M162 212 L154 318 L142 428 L132 448 L148 452 L164 428 L172 318 Z">
      <title>{% t "Legs (posterior)" "腿部（後側）" %}</title>
    </path>
  </g>

  <!-- Legend -->
  <g transform="translate(24,492)" font-size="10" fill="#8aa0bf" font-family="ui-sans-serif,system-ui,sans-serif">
    <circle cx="6" cy="-4" r="4" fill="rgba(251,191,36,0.75)"/><text x="14" y="-1">{% t "Chest" "胸" %}</text>
    <circle cx="86" cy="-4" r="4" fill="rgba(34,197,94,0.75)"/><text x="94" y="-1">{% t "Back" "背" %}</text>
    <circle cx="156" cy="-4" r="4" fill="rgba(239,68,68,0.75)"/><text x="164" y="-1">{% t "Arms" "臂" %}</text>
    <circle cx="226" cy="-4" r="4" fill="rgba(253,186,116,0.75)"/><text x="234" y="-1">{% t "Core" "核心" %}</text>
    <circle cx="306" cy="-4" r="4" fill="rgba(148,163,184,0.85)"/><text x="314" y="-1">{% t "Legs" "腿" %}</text>
    <circle cx="386" cy="-4" r="4" fill="rgba(168,85,247,0.75)"/><text x="394" y="-1">{% t "Abductors" "髖外展" %}</text>
    <circle cx="486" cy="-4" r="4" fill="rgba(251,146,60,0.75)"/><text x="494" y="-1">{% t "Shoulders" "肩" %}</text>
  </g>
</svg>
