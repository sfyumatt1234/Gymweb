{% extends "base.html" %}
{% load bilingual %}
{% block title %}{% t "Profile · GymWeb" "個人資料 · GymWeb" %}{% endblock %}

{% block content %}
<h1>{% t "Profile" "個人資料" %}</h1>
<form method="post" class="form">
  {% csrf_token %}
  {% for field in form %}
    <label>
      <span>{{ field.label|safe }}</span>
      {{ field }}
      {{ field.errors }}
    </label>
  {% endfor %}
  <div class="actions">
    <button class="btn" type="submit">{% t "Save profile" "儲存個人資料" %}</button>
  </div>
</form>
{% endblock %}
