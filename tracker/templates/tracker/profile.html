{% extends "base.html" %}
{% block title %}Profile · Gymweb{% endblock %}

{% block content %}
<h1>Profile</h1>
<form method="post" class="form">
  {% csrf_token %}
  {% for field in form %}
    <label>
      <span>{{ field.label }}</span>
      {{ field }}
      {{ field.errors }}
    </label>
  {% endfor %}
  <div class="actions">
    <button class="btn" type="submit">Save profile</button>
  </div>
</form>
{% endblock %}
